<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>SPIDER-AI V2.2</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div id="app">

    <!-- CAMERA -->

    <video
        id="camera"
        autoplay
        playsinline
        muted
    ></video>


    <!-- HUD -->

    <div id="hud">


        <!-- TOP -->

        <header class="top-bar">

            <div>

                <div class="logo">
                    SPIDER-AI
                </div>

                <div class="version">
                    V2.2 // VISION SYSTEM
                </div>

            </div>


            <div class="system-status">

                <span
                    id="statusIndicator"
                    class="status-dot"
                ></span>

                <span id="systemStatus">
                    OFFLINE
                </span>

            </div>

        </header>


        <!-- SCANNER -->

        <div id="scanner">

            <div id="scanFrame">

                <span class="corner tl"></span>
                <span class="corner tr"></span>
                <span class="corner bl"></span>
                <span class="corner br"></span>

                <div id="crosshair">
                    +
                </div>

            </div>


            <div id="scanMessage">
                CAMERA OFF
            </div>

        </div>


        <!-- TARGET INFORMATION -->

        <section
            id="targetPanel"
            class="glass-panel"
        >

            <div class="panel-heading">
                PRIMARY TARGET
            </div>


            <div
                id="objectName"
                class="target-name"
            >
                NONE
            </div>


            <div class="target-row">

                <span>
                    CONFIDENCE
                </span>

                <strong id="confidence">
                    --
                </strong>

            </div>


            <div class="confidence-bar">

                <div
                    id="confidenceFill"
                ></div>

            </div>


            <div class="target-row">

                <span>
                    TRACK
                </span>

                <strong id="trackingStatus">
                    OFF
                </strong>

            </div>

        </section>


        <!-- SCAN INFORMATION -->

        <section
            id="scanPanel"
            class="glass-panel"
        >

            <div class="panel-heading">
                SCAN SYSTEM
            </div>


            <div class="data-row">

                <span>
                    OBJECTS
                </span>

                <strong id="objectCount">
                    0
                </strong>

            </div>


            <div class="data-row">

                <span>
                    SCAN RATE
                </span>

                <strong id="scanRate">
                    0 FPS
                </strong>

            </div>


            <div class="data-row">

                <span>
                    MODEL
                </span>

                <strong id="modelStatus">
                    OFF
                </strong>

            </div>


            <div class="data-row">

                <span>
                    CAMERA
                </span>

                <strong id="cameraStatus">
                    OFF
                </strong>

            </div>

        </section>


        <!-- SYSTEM BAR -->

        <section id="systemBar">

            <div class="system-cell">

                <span>AI</span>

                <strong id="aiStatus">
                    STANDBY
                </strong>

            </div>


            <div class="system-cell">

                <span>TRACK</span>

                <strong id="trackStatus">
                    OFF
                </strong>

            </div>


            <div class="system-cell">

                <span>DEPTH</span>

                <strong id="depthStatus">
                    NONE
                </strong>

            </div>


            <div class="system-cell">

                <span>BATTERY</span>

                <strong id="battery">
                    --
                </strong>

            </div>

        </section>


        <!-- START -->

        <button
            id="startButton"
            type="button"
        >
            START SPIDER-AI
        </button>


        <!-- FOOTER -->

        <footer id="footer">

            <span>
                SPIDER-AI
            </span>

            <span>
                V2.2
            </span>

            <span>
                VISION
            </span>

        </footer>


    </div>

</div>


<!-- =====================================================
     AI LIBRARIES
====================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0">
</script>


<script
    src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd">
</script>


<!-- =====================================================
     SPIDER-AI
====================================================== -->

<script src="settings.js"></script>

<script src="hud.js"></script>

<script src="distance.js"></script>

<script src="vision.js"></script>

<script src="ai.js"></script>

<script src="app.js"></script>


</body>

</html>
