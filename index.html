<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <meta
        name="description"
        content="SPIDER-AI mobile vision assistant"
    >

    <title>SPIDER-AI V2</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main id="app">


        <!-- =================================================
             CAMERA
        ================================================== -->

        <video
            id="camera"
            autoplay
            playsinline
            muted
        ></video>


        <!-- =================================================
             MAIN HUD
        ================================================== -->

        <div id="hud">


            <!-- =================================================
                 TOP SYSTEM BAR
            ================================================== -->

            <header class="top-bar">


                <div class="system-name">

                    <div class="logo">
                        SPIDER-AI
                    </div>

                    <div class="version">
                        V2 // MOBILE PROTOTYPE
                    </div>

                </div>


                <div class="system-status">

                    <span
                        id="statusIndicator"
                        class="status-dot"
                    ></span>

                    <span id="systemStatus">
                        OFFLINE
                    </span>

                </div>


            </header>



            <!-- =================================================
                 CAMERA / VISION AREA
            ================================================== -->

            <section id="visionArea">


                <!-- Main targeting frame -->

                <div id="targetFrame">


                    <div
                        class="corner top-left"
                    ></div>


                    <div
                        class="corner top-right"
                    ></div>


                    <div
                        class="corner bottom-left"
                    ></div>


                    <div
                        class="corner bottom-right"
                    ></div>


                    <div id="crosshair">
                        +
                    </div>


                    <div id="targetText">
                        CAMERA OFF
                    </div>


                </div>



                <!-- AI detection box -->

                <div
                    id="detectionBox"
                    class="hidden"
                >


                    <div
                        class="detection-corner top-left"
                    ></div>


                    <div
                        class="detection-corner top-right"
                    ></div>


                    <div
                        class="detection-corner bottom-left"
                    ></div>


                    <div
                        class="detection-corner bottom-right"
                    ></div>


                    <div id="detectionLabel">
                        OBJECT
                    </div>


                </div>


            </section>



            <!-- =================================================
                 AI OBJECT INFORMATION
            ================================================== -->

            <section id="objectPanel">


                <span class="panel-title">
                    AI VISION
                </span>


                <div
                    id="objectName"
                    class="large-value"
                >
                    STANDBY
                </div>


                <div id="confidence">
                    CONFIDENCE: --
                </div>


            </section>



            <!-- =================================================
                 DISTANCE
            ================================================== -->

            <section id="distancePanel">


                <span class="panel-title">
                    DISTANCE
                </span>


                <div
                    id="distance"
                    class="distance-value"
                >
                    --
                </div>


                <div class="distance-unit">
                    METERS
                </div>


                <div id="distanceMode">
                    SENSOR: NOT CONNECTED
                </div>


            </section>



            <!-- =================================================
                 SYSTEM STATUS
            ================================================== -->

            <section id="systemPanel">


                <div class="system-item">

                    <span>
                        CAMERA
                    </span>

                    <b id="cameraStatus">
                        OFF
                    </b>

                </div>


                <div class="system-item">

                    <span>
                        AI
                    </span>

                    <b id="aiStatus">
                        STANDBY
                    </b>

                </div>


                <div class="system-item">

                    <span>
                        DEPTH
                    </span>

                    <b id="depthStatus">
                        OFF
                    </b>

                </div>


                <div class="system-item">

                    <span>
                        BATTERY
                    </span>

                    <b id="battery">
                        --%
                    </b>

                </div>


            </section>



            <!-- =================================================
                 VOICE STATUS
            ================================================== -->

            <section id="voicePanel">


                <span class="panel-title">
                    VOICE
                </span>


                <span id="voiceStatus">
                    READY
                </span>


            </section>



            <!-- =================================================
                 START BUTTON
            ================================================== -->

            <button
                id="startButton"
                type="button"
            >
                START SPIDER-AI
            </button>



            <!-- =================================================
                 BOTTOM BAR
            ================================================== -->

            <footer id="bottomBar">

                <span>
                    SPIDER-AI
                </span>

                <span>
                    V2.0
                </span>

                <span>
                    MOBILE
                </span>

            </footer>


        </div>


    </main>



    <!-- =====================================================
         SPIDER-AI MODULES

         IMPORTANT:
         These are loaded in dependency order.
    ====================================================== -->


    <!-- Configuration -->

    <script
        src="settings.js"
    ></script>


    <!-- HUD controller -->

    <script
        src="hud.js"
    ></script>


    <!-- Voice system -->

    <script
        src="voice.js"
    ></script>


    <!-- Distance system -->

    <script
        src="distance.js"
    ></script>


    <!-- Vision system -->

    <script
        src="vision.js"
    ></script>


    <!-- AI brain -->

    <script
        src="ai.js"
    ></script>


    <!-- Main application controller -->

    <script
        src="app.js"
    ></script>


</body>

</html>
