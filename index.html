<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>SPIDER-AI V2</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<main id="app">

    <video
        id="camera"
        autoplay
        playsinline
        muted
    ></video>


    <div id="hud">

        <!-- TOP BAR -->

        <header class="top-bar">

            <div>

                <div class="logo">
                    SPIDER-AI
                </div>

                <div class="version">
                    V2 // MOBILE
                </div>

            </div>

            <div class="system-status">

                <span
                    id="statusIndicator"
                    class="status-dot"
                ></span>

                <span id="systemStatus">
                    OFFLINE
                </span>

            </div>

        </header>


        <!-- VISION -->

        <section id="visionArea">

            <div id="targetFrame">

                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>

                <div id="crosshair">
                    +
                </div>

                <div id="targetText">
                    CAMERA OFF
                </div>

            </div>


            <div
                id="detectionBox"
                class="hidden"
            >

                <div class="detection-corner top-left"></div>
                <div class="detection-corner top-right"></div>
                <div class="detection-corner bottom-left"></div>
                <div class="detection-corner bottom-right"></div>

                <div id="detectionLabel">
                    OBJECT
                </div>

            </div>

        </section>


        <!-- AI PANEL -->

        <section id="objectPanel">

            <span class="panel-title">
                AI VISION
            </span>

            <div
                id="objectName"
                class="large-value"
            >
                STANDBY
            </div>

            <div id="confidence">
                CONFIDENCE: --
            </div>

        </section>


        <!-- DISTANCE -->

        <section id="distancePanel">

            <span class="panel-title">
                DISTANCE
            </span>

            <div
                id="distance"
                class="distance-value"
            >
                --
            </div>

            <div class="distance-unit">
                METERS
            </div>

            <div id="distanceMode">
                SENSOR: NOT CONNECTED
            </div>

        </section>


        <!-- SYSTEM -->

        <section id="systemPanel">

            <div class="system-item">
                <span>CAMERA</span>
                <b id="cameraStatus">OFF</b>
            </div>

            <div class="system-item">
                <span>AI</span>
                <b id="aiStatus">STANDBY</b>
            </div>

            <div class="system-item">
                <span>DEPTH</span>
                <b id="depthStatus">OFF</b>
            </div>

            <div class="system-item">
                <span>BATTERY</span>
                <b id="battery">--%</b>
            </div>

        </section>


        <!-- VOICE -->

        <section id="voicePanel">

            <span class="panel-title">
                VOICE
            </span>

            <span id="voiceStatus">
                READY
            </span>

        </section>


        <!-- START -->

        <button
            id="startButton"
            type="button"
        >
            START SPIDER-AI
        </button>


        <!-- BOTTOM -->

        <footer id="bottomBar">

            <span>SPIDER-AI</span>
            <span>V2.0</span>
            <span>MOBILE</span>

        </footer>

    </div>

</main>


<!-- =====================================================
     AI LIBRARIES
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>


<!-- =====================================================
     SPIDER-AI FILES
===================================================== -->

<script src="settings.js"></script>
<script src="hud.js"></script>
<script src="voice.js"></script>
<script src="distance.js"></script>
<script src="vision.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>


</body>
</html>
